name: Build TempMail APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # NOTE: android-actions/setup-android failed on run #1 (step "Set up Android SDK").
      # ubuntu-latest already ships an Android SDK, so use it directly instead of
      # re-installing it. This step never fails the build on its own: if platform 37
      # is already present, sdkmanager is a no-op.
      - name: Install Android platform 37 and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-37" "platform-tools" "build-tools;36.0.0" || true
          "$SDKMANAGER" --list_installed || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-DuckMail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## TempMail debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: 1.0.0 (code 1)" >> "$GITHUB_STEP_SUMMARY"
